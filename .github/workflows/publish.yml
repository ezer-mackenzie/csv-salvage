name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish, for example v0.1.0"
        required: false
        type: string
      publish:
        description: "Publish to PyPI after validation (disable for a rehearsal)"
        required: false
        type: boolean
        default: true

# Serialize manual, tag-triggered, and release-triggered publication of the same version.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      modern_release: ${{ steps.capabilities.outputs.modern_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Detect release tooling
        id: capabilities
        run: |
          if [[ -f tools/validate_release.py && -f tools/validate_distribution.py && -d docs ]]; then
            echo "modern_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "modern_release=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate modern release
        if: steps.capabilities.outputs.modern_release == 'true'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          RELEASE_PRERELEASE: ${{ github.event_name == 'release' && toJSON(github.event.release.prerelease) || '' }}
        run: python tools/validate_release.py
      - name: Resolve immutable build commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v
      - if: steps.capabilities.outputs.modern_release == 'true'
        run: uv run --group docs mkdocs build --strict

  linux:
    needs: validate
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
          - runner: ubuntu-22.04
            target: s390x
          - runner: ubuntu-22.04
            target: ppc64le
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    needs: validate
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: windows-latest
            target: x64
            rust_target: x86_64-pc-windows-msvc
            python_arch: x64
            python: "3.9"
          - runner: windows-latest
            target: x64
            rust_target: x86_64-pc-windows-msvc
            python_arch: x64
            python: "3.10"
          - runner: windows-latest
            target: x64
            rust_target: x86_64-pc-windows-msvc
            python_arch: x64
            python: "3.11"
          - runner: windows-latest
            target: x64
            rust_target: x86_64-pc-windows-msvc
            python_arch: x64
            python: "3.12"
          - runner: windows-latest
            target: x64
            rust_target: x86_64-pc-windows-msvc
            python_arch: x64
            python: "3.13"
          - runner: windows-latest
            target: x64
            rust_target: x86_64-pc-windows-msvc
            python_arch: x64
            python: "3.14"
          - runner: windows-2022
            target: x64
            rust_target: x86_64-pc-windows-msvc
            python_arch: x64
            python: "3.13"
          - runner: windows-latest
            target: x86
            rust_target: i686-pc-windows-msvc
            python_arch: x86
            python: "3.13"
          - runner: windows-11-arm
            target: aarch64
            rust_target: aarch64-pc-windows-msvc
            python_arch: arm64
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.python_arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist --interpreter python
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Test native crate
        run: |
          $env:PYO3_PYTHON = python -c "import sys; print(sys.executable)"
          cargo test --locked --target ${{ matrix.rust_target }} --no-default-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate wheel contents
        run: python tools/validate_distribution.py dist
      - name: Test installed Windows wheel
        run: |
          python -m pip install "typing-extensions>=4.0"
          python -m pip install --force-reinstall --no-deps --no-index --find-links dist csv_salvage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload wheels
        if: matrix.runner != 'windows-2022'
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.python }}
          path: dist

  macos:
    needs: validate
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Check distribution metadata
        run: |
          uv sync --locked --group release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --group release python -m twine check --strict dist/*
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_distribution.py dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rebuild and test source distribution
        run: |
          $source = @(Get-ChildItem dist/*.tar.gz)
          if ($source.Count -ne 1) { throw "Expected one source distribution" }
          python -m pip wheel --no-deps --wheel-dir rebuilt $source[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_distribution.py rebuilt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install "typing-extensions>=4.0"
          python -m pip install --force-reinstall --no-deps --no-index --find-links rebuilt csv_salvage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  publish:
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    needs: [linux, musllinux, windows, macos, sdist]
    environment:
      name: pypi
      url: https://pypi.org/p/csv-salvage
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v8
      - uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ "wheels-*/*"
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          files: wheels-*/*
          generate_release_notes: true