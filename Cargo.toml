[package]
name = "csv-salvage"
version = "0.1.0"
edition = "2024"
description = "High-performance library to salvage, repair, and parse corrupted or malformed CSV files."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/eliezer-reuven/csv-salvage"
keywords = ["csv", "salvage", "repair", "parser", "pyo3"]
categories = ["parser-implementations", "data-structures"]

[lib]
name = "csv_salvage"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module"] }
