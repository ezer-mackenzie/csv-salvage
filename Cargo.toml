[package]
name = "csv-salvage"
version = "0.8.0"
edition = "2024"
rust-version = "1.85"
description = "High-performance, fault-tolerant CSV salvage and reconstruction engine powered by Rust and PyO3"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/ezer-mackenzie/csv-salvage"
documentation = "https://csv-salvage.readthedocs.io/"
keywords = ["csv", "salvage", "repair", "parser", "pyo3"]
categories = ["parser-implementations", "data-structures"]

[lib]
name = "csv_salvage"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
memchr = "2.7"
memmap2 = "0.9"
pyo3 = { version = "0.29.0" }
rayon = "1.11"
