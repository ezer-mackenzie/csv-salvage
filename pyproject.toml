[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "csv-salvage"
description = "High-performance, fault-tolerant CSV salvage and reconstruction engine powered by Rust and PyO3"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
authors = [{ name = "Eli-ezer Reuven Ramirez Ruiz" }]
keywords = ["csv", "salvage", "repair", "parser", "dataframe"]
requires-python = ">=3.9,<3.15"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Documentation = "https://csv-salvage.readthedocs.io/"
Repository = "https://github.com/ezer-mackenzie/csv-salvage"
Issues = "https://github.com/ezer-mackenzie/csv-salvage/issues"
Changelog = "https://github.com/ezer-mackenzie/csv-salvage/blob/main/CHANGELOG.md"

[dependency-groups]
release = ["twine>=6.1,<7.0"]
docs = [
    "mkdocs>=1.6,<2.0",
]
dev = [
    "maturin>=1.15,<2.0",
    "pytest>=8.0",
]

[tool.maturin]
module-name = "csv_salvage._csv_salvage_backend"
python-source = "python"
include = [
    { path = "python/csv_salvage/py.typed", format = "wheel" },
    { path = "tests/*.py", format = "sdist" },
    { path = "tools/*.py", format = "sdist" },
]


